name: Deploy

# Roda a cada merge em main: aplica as migrations pendentes no Supabase e dispara
# um novo build Android (perfil "preview", o APK standalone) na EAS. O job de
# migrations é idempotente (todo arquivo em supabase/migrations usa `if not
# exists`/`create or replace`/`drop ... if exists`), então rodar tudo de novo a
# cada merge — mesmo os arquivos já aplicados manualmente antes — é seguro.
#
# Precisa de 2 secrets no repositório (Settings → Secrets and variables →
# Actions), nenhum dos dois configurável por aqui — ver aviso no PR/commit:
#   SUPABASE_DB_URL  — connection string do Postgres (Supabase Dashboard →
#                       Project Settings → Database → Connection string → URI)
#   EXPO_TOKEN       — token de acesso da conta Expo/EAS (`eas whoami` →
#                       expo.dev → Account settings → Access tokens)
on:
  push:
    branches: [main]

jobs:
  migrate:
    name: Apply Supabase migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply pending migrations
        if: ${{ secrets.SUPABASE_DB_URL != '' }}
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "Aplicando $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Secret not configured
        if: ${{ secrets.SUPABASE_DB_URL == '' }}
        run: echo "SUPABASE_DB_URL não configurado — pulando migrations (configure o secret pra ativar)."

  build:
    name: Trigger EAS build (Android preview)
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: expo/expo-github-action@v8
        if: ${{ secrets.EXPO_TOKEN != '' }}
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Trigger build
        if: ${{ secrets.EXPO_TOKEN != '' }}
        run: eas build --platform android --profile preview --non-interactive --no-wait

      - name: Secret not configured
        if: ${{ secrets.EXPO_TOKEN == '' }}
        run: echo "EXPO_TOKEN não configurado — pulando build (configure o secret pra ativar)."
